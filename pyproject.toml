[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poseadapt"
version = "0.1.0"
description = "Parameter-efficient fine-tuning for low-data human pose estimation in video"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PoseAdapt contributors" }]
keywords = ["human-pose-estimation", "vitpose", "lora", "computer-vision", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Use on Python 3.10/3.11. Install PyTorch for the desired CPU/CUDA platform first.
openmmlab = [
  "torch>=2.0",
  "torchvision>=0.15",
  "mmengine>=0.7.1,<1.0.0",
  "mmcv-lite>=2.0.1,<2.2.0",
  "mmpose==1.3.2",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
poseadapt-infer-image = "poseadapt.cli.infer_image:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
